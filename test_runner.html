<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Customer Test Runner</title>
</head>
<body>
    <div id="test-logs"></div>
    <iframe id="app-frame" src="http://localhost:3000/" style="width:400px; height:800px;"></iframe>
    <script>
        const logs = [];
        function log(msg) {
            logs.push(msg);
            document.getElementById('test-logs').innerHTML = logs.join('<br>');
        }
        window.addEventListener('error', (e) => {
            log('GLOBAL ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
        });

        const frame = document.getElementById('app-frame');
        frame.onload = () => {
            try {
                const win = frame.contentWindow;
                const doc = frame.contentDocument;
                const app = win.app;

                log('App loaded: ' + (app ? 'YES' : 'NO'));
                if (!app) return;

                // Check 1: Timer & displays
                const hourDisplay = doc.getElementById('current-hour-display');
                const timerDisplay = doc.getElementById('countdown-timer');
                log('Hour display: ' + (hourDisplay ? hourDisplay.textContent : 'NULL'));
                log('Timer display: ' + (timerDisplay ? timerDisplay.textContent : 'NULL'));

                // Check 2: Customer UI logged out
                app.updateCustomerUI();
                log('Logged out customerLoginBtn visible: ' + (!doc.getElementById('customer-login-btn').classList.contains('hidden')));

                // Check 3: Customer Login action
                const cust = {
                    id: 'testuser123',
                    name: 'Test User',
                    mobile: '9876543210',
                    dob: '1995-05-15',
                    pin: 'Pass12345',
                    coins: 50,
                    joinedAt: Date.now(),
                    totalBets: 2,
                    wins: 1,
                    betHistory: [
                        { id: 'b1', number: 50, amount: 20, status: 'WON', payout: 180, targetSlot: '12:00 PM', targetDate: 'Today', placedTime: '11:15 AM' },
                        { id: 'b2', number: 20, amount: 10, status: 'LOST', winningNumber: 70, targetSlot: '04:00 PM', targetDate: 'Today', placedTime: '03:10 PM' }
                    ]
                };
                app.customersDb['testuser123'] = cust;
                app.currentCustomer = cust;
                app.saveCustomerSession(cust);
                app.updateCustomerUI();

                log('Logged in chipPlayerName: ' + doc.getElementById('chip-player-name')?.textContent);
                log('Logged in chipPlayerCoins: ' + doc.getElementById('chip-player-coins')?.textContent);

                // Check 4: Open Player Portal Modal
                app.openAuthModal('bets');
                log('AuthModal hidden: ' + doc.getElementById('customer-auth-modal')?.classList.contains('hidden'));
                log('DashPlayerName: ' + doc.getElementById('dash-player-name')?.textContent);
                log('DashPlayerCoins: ' + doc.getElementById('dash-player-coins')?.textContent);

                // Check 5: Bets subtab
                app.setCustomerDashSubtab('bets');
                log('Bets list innerHTML length: ' + doc.getElementById('cust-bets-history-list')?.children.length);

                // Check 6: Deposit subtab
                app.setCustomerDashSubtab('deposit');
                log('Deposit pane hidden: ' + doc.getElementById('dash-deposit-pane')?.classList.contains('hidden'));

                // Check 7: Withdraw subtab
                app.setCustomerDashSubtab('withdraw');
                log('Withdraw pane hidden: ' + doc.getElementById('dash-withdraw-pane')?.classList.contains('hidden'));

                // Check 8: History subtab
                app.setCustomerDashSubtab('history');
                log('History pane hidden: ' + doc.getElementById('dash-history-pane')?.classList.contains('hidden'));

                // Check 9: Profile subtab
                app.setCustomerDashSubtab('profile');
                log('Profile name: ' + doc.getElementById('dash-prof-name')?.textContent);
                log('Profile ID: ' + doc.getElementById('dash-prof-id')?.textContent);
                log('Profile Mobile: ' + doc.getElementById('dash-prof-mobile')?.textContent);

                // Check 10: Place Prediction
                app.selectedBetNumber = 40;
                app.selectedBetAmount = 20;
                app.placeCustomerPrediction();
                log('Prediction placed. Customer balance: ' + app.currentCustomer.coins);
                log('Active bets count: ' + app.activeBets.length);
                log('Chip active bets badge: ' + doc.getElementById('chip-active-bets-count')?.textContent);

                log('ALL TESTS COMPLETED SUCCESSFULLY WITH NO ERRORS!');
            } catch (err) {
                log('TEST EXCEPTION: ' + err.message + '\n' + err.stack);
            }
        };
    </script>
</body>
</html>
